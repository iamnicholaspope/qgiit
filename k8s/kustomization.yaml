apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app

resources:
  - namespace.yaml
  - postgres.yaml
  - app.yaml
  - cloudflared.yaml
  - backup-cronjob.yaml

# The pipeline updates newName/newTag after each successful build.
images:
  - name: APP_IMAGE
    newName: ghcr.io/OWNER/REPO
    newTag: latest
