# Test on every pull request. On merge to main: test, build an arm64 image,
# push it to GitHub Container Registry, then bump the tag in k8s/kustomization.yaml.
# Flux (running in the cluster) sees that commit and rolls out the new version.
name: pipeline

on:
  pull_request:
    paths: ["app/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/**"]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  build-and-deploy:
    if: github.event_name == 'push'
    needs: test
    # Free native Arm runner for public repos. For a private repo, use ubuntu-latest
    # and add a docker/setup-qemu-action@v3 step (slower, but works).
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write   # to commit the new image tag
      packages: write   # to push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Image name (must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point Kubernetes at the new image
        run: |
          sed -i "s|newName: .*|newName: ${IMAGE}|; s|newTag: .*|newTag: ${GITHUB_SHA}|" k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "deploy: ${GITHUB_SHA::7}"
          git push
